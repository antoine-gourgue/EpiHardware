services:
  db:
    image: postgres:16-alpine
    container_name: epihardware-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: epihardware
      POSTGRES_PASSWORD: epihardware
      POSTGRES_DB: epihardware
    ports:
      - "5432:5432"
    volumes:
      - epihardware_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epihardware"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  epihardware_pgdata:
